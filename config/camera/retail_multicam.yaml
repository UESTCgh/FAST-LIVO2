multi_camera:
  cameras: [left]
  association_window_s: 0.008
  camera_wait_s: 0.04
  img_point_cov: 1000.0
  max_translation_correction: 0.03
  max_rotation_correction_deg: 0.4
  rotation_weight: 0.20
  translation_weight: 1.0
  axial_weight: 0.0
  feedback_gain: 0.35

  left:
    topic: /left_camera/image
    transport: raw
    # The recorded camera and LiDAR headers have identical timestamps.
    time_offset: 0.0
    Rcl: [0.00610193, -0.999863, -0.0154172,
          -0.00615449, 0.0153796, -0.999863,
          0.999962, 0.00619598, -0.0060598]
    Pcl: [0.0194384, 0.104689, -0.0251952]
