# --- 1. 基础通信配置 (Common) ---
common:
  img_topic: "/airsim_node/drone_1/front_left/Scene"
  lid_topic: "/airsim_node/drone_1/lidar"
  imu_topic: "/airsim_node/drone_1/imu/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: true

# --- 2. 相机内参 (按照报错要求的平铺格式) ---
# 必须放在根目录下或加载到 laserMapping 命名空间下
cam_model: "Pinhole"
cam_width: 960
cam_height: 720
cam_fx: 831.38
cam_fy: 831.38
cam_cx: 480.0
cam_cy: 360.0
# 畸变参数 (AirSim 默认为 0)
cam_d0: 0.0
cam_d1: 0.0
cam_d2: 0.0
cam_d3: 0.0
scale: 1.0

# --- 3. 传感器外参 (Extrinsic) ---
extrin_calib:
  # Lidar 相对于 IMU 的位姿
  extrinsic_T: [0.0, 0.0, 0.05] 
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  
  # 相机相对于 Lidar 的位姿 (Pcl = Cam_pos - Lidar_pos)
  Pcl: [0.175, -0.15, 0.05]
  # 旋转矩阵：从相机坐标系到雷达坐标系
  Rcl: [0, -1, 0, 
        0, 0, -1, 
        1, 0, 0]

# --- 4. 点云预处理 (Preprocess) ---
preprocess:
  lidar_type: 2          # 2 代表标准 PointCloud2
  scan_line: 32         
  blind: 0.2            
  timestamp_unit: 3      # 3: 使用 ROS Header 时间戳
  point_filter_num: 1
  filter_size_surf: 0.1

# --- 5. 视觉惯性里程计 (VIO) ---
vio:
  max_iterations: 5
  outlier_threshold: 1000 
  img_point_cov: 100 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

# --- 6. 惯性测量单元 (IMU) ---
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.3           
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

# --- 7. 激光里程计 (LIO) ---
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

# --- 8. 其他系统参数 ---
uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: true
  path_en: true
  scan_publish_en: true

pcd_save:
  pcd_save_en: false
  interval: -1
